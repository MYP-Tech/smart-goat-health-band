<path d="M-3 4 Q0 6 3 4" stroke="#534AB7" stroke-width="1.2" fill="none"/>
</g>
<text class="th" x="98" y="114" dominant-baseline="central">Neckband</text>
<text class="ts" x="98" y="130" dominant-baseline="central">ESP32 device</text>
<text class="ts" x="60" y="158" dominant-baseline="central">Reads motion + temp</text>
<text class="ts" x="60" y="174" dominant-baseline="central">Edge compute</text>
</g>

<g class="c-green">
<rect x="255" y="80" width="170" height="110" rx="10" stroke-width="0.5"/>
