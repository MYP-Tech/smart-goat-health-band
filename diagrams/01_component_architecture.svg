<text class="ts" x="313" y="130" dominant-baseline="central">Raspberry Pi</text>
<text class="ts" x="275" y="158" dominant-baseline="central">Aggregates packets</text>
<text class="ts" x="275" y="174" dominant-baseline="central">Buffers offline</text>
</g>

<g class="c-blue">
<rect x="470" y="80" width="170" height="110" rx="10" stroke-width="0.5"/>
<g transform="translate(500,118)">
<path d="M-13 4 Q-13 -7 -2 -7 Q-2 -13 5 -13 Q13 -13 13 -5 Q17 -5 17 0 Q17 5 11 5 L-9 5 Q-13 5 -13 4 Z" fill="none" stroke="#185FA5" stroke-width="1.4"/>
