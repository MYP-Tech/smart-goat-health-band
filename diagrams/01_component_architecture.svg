<rect x="40" y="420" width="600" height="100" rx="10" stroke-width="0.5"/>
</g>
<text class="th" x="56" y="442" dominant-baseline="central">Legend</text>

<g transform="translate(56,460)">
<rect x="0" y="0" width="14" height="10" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="ts" x="22" y="5" dominant-baseline="central">Edge device</text>
</g>

<g transform="translate(170,460)">
<rect x="0" y="0" width="14" height="10" rx="2" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
<text class="ts" x="22" y="5" dominant-baseline="central">On-prem hub</text>
</g>

<g transform="translate(290,460)">
<rect x="0" y="0" width="14" height="10" rx="2" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text class="ts" x="22" y="5" dominant-baseline="central">Cloud service</text>
</g>

<g transform="translate(410,460)">
<rect x="0" y="0" width="14" height="10" rx="2" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
<text class="ts" x="22" y="5" dominant-baseline="central">Mobile app</text>
</g>

<g transform="translate(520,460)">
<rect x="0" y="0" width="14" height="10" rx="2" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text class="ts" x="22" y="5" dominant-baseline="central">Human user</text>
</g>

<g transform="translate(56,486)">
<line x1="0" y1="5" x2="22" y2="5" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="5" dominant-baseline="central">Solid — production data flow</text>
</g>

<g transform="translate(290,486)">
<line x1="0" y1="5" x2="22" y2="5" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="5" dominant-baseline="central">Dashed — MVP-only path</text>
</g>

<g transform="translate(56,506)">
<line x1="0" y1="5" x2="22" y2="5" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>
<text class="ts" x="30" y="5" dominant-baseline="central">Dotted — physical / out of band</text>
