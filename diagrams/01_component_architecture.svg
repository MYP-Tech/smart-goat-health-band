<line x1="-9" y1="-7" x2="9" y2="-7" stroke="#854F0B" stroke-width="0.7"/>
<line x1="-9" y1="-3" x2="9" y2="-3" stroke="#854F0B" stroke-width="0.7"/>
<line x1="-9" y1="1" x2="9" y2="1" stroke="#854F0B" stroke-width="0.7"/>
<line x1="-9" y1="5" x2="9" y2="5" stroke="#854F0B" stroke-width="0.7"/>
<rect x="-2" y="8" width="4" height="3" fill="#854F0B"/>
