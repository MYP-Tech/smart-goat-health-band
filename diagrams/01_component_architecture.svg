<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" viewBox="0 0 680 540" role="img">
<title>GoatBand component architecture</title>
<desc>Major components and how they communicate.</desc>
<style>
  .th { font: 500 14px sans-serif; fill: #1F1E1B; }
  .ts { font: 400 12px sans-serif; fill: #5F5E5A; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
