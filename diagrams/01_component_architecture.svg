<text class="ts" x="528" y="130" dominant-baseline="central">Backend services</text>
<text class="ts" x="490" y="158" dominant-baseline="central">Stores history</text>
<text class="ts" x="490" y="174" dominant-baseline="central">Fires alerts</text>
</g>

<g class="c-amber">
