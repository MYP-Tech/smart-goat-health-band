<text class="th" x="98" y="314" dominant-baseline="central">Charging dock</text>
<text class="ts" x="98" y="330" dominant-baseline="central">30-slot tray</text>
<text class="ts" x="60" y="358" dominant-baseline="central">Charges spare cells</text>
<text class="ts" x="60" y="374" dominant-baseline="central">Out of band</text>
</g>

<g class="c-pink">
<rect x="255" y="280" width="170" height="110" rx="10" stroke-width="0.5"/>
<g transform="translate(285,318)">
<rect x="-7" y="-12" width="14" height="22" rx="2" fill="none" stroke="#993556" stroke-width="1.4"/>
<rect x="-5" y="-9" width="10" height="14" fill="none" stroke="#993556" stroke-width="0.7"/>
<circle cx="0" cy="7.5" r="0.8" fill="#993556"/>
