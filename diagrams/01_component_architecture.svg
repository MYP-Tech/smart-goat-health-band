<text class="th" x="313" y="314" dominant-baseline="central">Mobile app</text>
<text class="ts" x="313" y="330" dominant-baseline="central">Flutter client</text>
<text class="ts" x="275" y="358" dominant-baseline="central">Dashboard + alerts</text>
<text class="ts" x="275" y="374" dominant-baseline="central">Per-goat history</text>
</g>

<g class="c-coral">
<rect x="470" y="280" width="170" height="110" rx="10" stroke-width="0.5"/>
<g transform="translate(500,318)">
<circle cx="0" cy="-2" r="6" fill="none" stroke="#993C1D" stroke-width="1.4"/>
<path d="M-8 12 Q-8 4 0 4 Q8 4 8 12" fill="none" stroke="#993C1D" stroke-width="1.4"/>
</g>
<text class="th" x="528" y="314" dominant-baseline="central">Farmer</text>
<text class="ts" x="528" y="330" dominant-baseline="central">End user</text>
<text class="ts" x="490" y="358" dominant-baseline="central">Reads alerts</text>
<text class="ts" x="490" y="374" dominant-baseline="central">Logs weight</text>
</g>

<line x1="210" y1="120" x2="253" y2="120" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="231" y="112" text-anchor="middle">LoRa</text>

<line x1="425" y1="120" x2="468" y2="120" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="446" y="112" text-anchor="middle">MQTT</text>

<line x1="555" y1="190" x2="370" y2="278" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="466" y="234">Push notify</text>

<path d="M125 190 L125 232 L340 232 L340 278" stroke="#5F5E5A" stroke-width="1" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="232" y="226" text-anchor="middle">BLE (MVP 1 to 3)</text>

<line x1="470" y1="335" x2="427" y2="335" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="448" y="329" text-anchor="middle">taps</text>

<path d="M125 280 L125 254 L98 254 L98 192" stroke="#5F5E5A" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
<text class="ts" x="62" y="240">battery swap</text>

