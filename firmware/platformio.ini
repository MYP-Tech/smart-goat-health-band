; PlatformIO project — GoatBand MVP-1
; Board: ESP32 NodeMCU-32S
; Framework: ESP-IDF (native, no Arduino)
;
; To use:
;   1. Install VS Code + PlatformIO IDE extension
;   2. Open this folder as a PlatformIO project
;   3. Run: PlatformIO: Build → PlatformIO: Upload → PlatformIO: Monitor

[env:nodemcu-32s]
platform = espressif32@6.7.0
board = nodemcu-32s
framework = espidf

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BT_BLUEDROID_ENABLED=1
    -DCONFIG_BT_BLE_ENABLED=1

board_build.partitions = partitions.csv
